<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-다가 수업 슬라이드</title>
<style>
:root{--bg:#e9edf2;--bar:rgba(255,255,255,.94);--ink:#1f2937;--sub:#4b5563;--line:#cbd5e1;--accent:#2563eb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;background:#fff;cursor:pointer;touch-action:manipulation;user-select:none;overflow:hidden}
.v{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .15s ease}
.v.on{opacity:1}
#stage.dim .v.on{opacity:0}
.hot{position:absolute;border:0;background:transparent;border-radius:12px;cursor:pointer;padding:0;z-index:3}
.hot:hover,.hot:focus-visible{outline:3px solid var(--accent);outline-offset:2px;background:rgba(37,99,235,.06)}
#clip{position:absolute;display:none;background:#000;border-radius:4px;z-index:3}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:0 6px 20px rgba(15,23,42,.12);transition:opacity .25s ease,transform .25s ease;z-index:10}
#bar.hide{opacity:0;pointer-events:none;transform:translate(-50%,8px)}
#bar button,#bar select{height:44px;min-width:44px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;font:inherit;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
#bar button:hover,#bar select:hover{border-color:var(--accent)}
#bar button:focus-visible,#bar select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#bar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#count{min-width:74px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px;color:var(--sub)}
#dl{font-size:13px;color:var(--sub);min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
#load{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:var(--bg);z-index:20;font-size:18px}
#load .track{width:min(360px,70vw);height:10px;border-radius:6px;background:#fff;border:1px solid var(--line);overflow:hidden}
#load .fill{height:100%;width:0;background:var(--accent);transition:width .2s}
#load button{height:48px;padding:0 22px;border-radius:12px;border:0;background:var(--accent);color:#fff;font:inherit;font-size:18px;cursor:pointer}
#load button:disabled{background:#94a3b8;cursor:default}
#load small{color:var(--sub);font-size:14px;text-align:center;line-height:1.6;padding:0 16px}
@media (prefers-reduced-motion:reduce){.v,#bar{transition:none}}
</style>
</head>
<body>
<div id="load">
  <div id="loadmsg">슬라이드를 준비하는 중…</div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div id="loadsub" style="font-size:15px;color:#4b5563">받은 슬라이드 0 / 0</div>
  <button id="start" disabled>수업 시작</button>
  <small>첫 슬라이드가 준비되면 바로 시작할 수 있어요. 나머지는 수업하는 동안 뒤에서 받아요.<br>
  클릭 · → · Space · PageDown: 다음 &nbsp;/&nbsp; ← · PageUp: 이전 &nbsp;/&nbsp; F: 전체 화면 &nbsp;/&nbsp; 번호 + Enter: 그 슬라이드로</small>
</div>
<div id="wrap"><div id="stage" aria-label="슬라이드">
  <video class="v on" id="va" muted playsinline preload="auto"></video>
  <video class="v" id="vb" muted playsinline preload="auto"></video>
  <video id="clip" src="clip.mp4" controls preload="none" playsinline></video>
</div></div>
<div id="bar" role="toolbar" aria-label="슬라이드 조작">
  <button id="prev" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span id="count" aria-live="polite">1 / 33</span>
  <button id="next" aria-label="다음"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <select id="jump" aria-label="슬라이드로 이동"></select>
  <span id="dl" title="미리 받은 슬라이드"></span>
  <button id="full" aria-label="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

se,"waits":[[0.561,3.234],[3.63,6.303],[6.831,9.24],[9.636,12.243],[12.639,15.246],[15.642,18.315],[18.513,21.252],[21.648,24.651],[24.651,27.258],[28.017,40.887]],"skip":0.62,"links":[],"media":null},{"n":18,"hidden":false,"waits":[[0.594,3.3],[3.531,6.072],[7.227,25.08]],"skip":0.62,"links":[],"media":null},{"n":19,"hidden":false,"waits":[[0.528,3.168],[3.828,6.402],[7.029,9.669],[9.9,15.246]],"skip":0.62,"links":[],"media":null},{"n":20,"hidden":false,"waits":[[0.759,3.3],[3.564,6.138],[6.501,9.207],[9.471,12.012],[12.408,15.279]],"skip":0.62,"links":[],"media":null},{"n":21,"hidden":false,"waits":[[1.287,3.3],[3.564,6.138],[6.501,9.207],[9.471,12.045],[12.408,15.279]],"skip":0.62,"links":[],"media":null},{"n":22,"hidden":false,"waits":[[0.561,3.135],[3.597,6.138],[6.567,9.108],[9.504,12.045],[12.474,15.015],[15.444,18.018],[18.414,31.086]],"skip":0.62,"links":[],"media":null},{"n":23,"hidden":false,"waits":[[0.528,3.432]],"skip":0.62,"links":[{"box":[4.896,31.296,16.771,24.259],"to":34},{"box":[23.229,31.296,16.771,24.259],"to":35},{"box":[41.667,31.296,16.771,24.259],"to":36},{"box":[60.0,31.296,16.771,24.259],"to":37},{"box":[78.333,31.296,16.771,24.259],"to":38},{"box":[4.896,59.074,16.771,24.259],"to":39},{"box":[23.229,59.074,16.771,24.259],"to":39},{"box":[41.667,59.074,16.771,24.259],"to":40},{"box":[60.0,59.074,16.771,24.259],"to":41},{"box":[78.333,59.074,16.771,24.259],"to":34}],"media":null},{"n":24,"hidden":false,"waits":[[0.891,3.465]],"skip":0.62,"links":[],"media":[11.042,17.407,78.021,77.963]},{"n":25,"hidden":false,"waits":[[0.528,3.135],[3.531,6.072],[6.435,8.976],[9.339,11.847],[12.243,14.817],[15.147,17.688],[18.051,20.922]],"skip":0.62,"links":[],"media":null},{"n":26,"hidden":false,"waits":[[0.495,3.135],[4.323,12.144]],"skip":0.62,"links":[],"media":null},{"n":27,"hidden":false,"waits":[[0.891,3.597],[5.445,8.151],[8.547,16.467]],"skip":0.62,"links":[],"media":null},{"n":28,"hidden":false,"waits":[[0.429,3.201],[5.379,8.217],[8.646,16.533]],"skip":0.62,"links":[],"media":null},{"n":29,"hidden":false,"waits":[[0.462,3.465],[5.445,8.052],[8.481,16.401]],"skip":0.62,"links":[],"media":null},{"n":30,"hidden":false,"waits":[[0.429,3.366],[5.841,8.25],[8.679,16.5]],"skip":0.62,"links":[],"media":null},{"n":31,"hidden":false,"waits":[[1.188,3.201],[3.597,6.171],[6.534,9.108],[9.504,12.045],[12.507,17.853]],"skip":0.62,"links":[],"media":null},{"n":32,"hidden":false,"waits":[[1.122,3.3],[6.732,9.669],[10.098,12.969]],"skip":0.62,"links":[],"media":null},{"n":33,"hidden":false,"waits":[[1.848,4.686]],"skip":0.62,"links":[],"media":null},{"n":34,"hidden":true,"waits":[[2.343,4.917],[5.346,13.2]],"skip":0.62,"links":[{"box":[76.875,5.0,18.958,7.407],"to":"back"}],"media":null},{"n":35,"hidden":true,"waits":[[2.376,4.95],[5.412,13.266]],"skip":0.62,"links":[{"box":[76.875,5.0,18.958,7.407],"to":"back"}],"media":null},{"n":36,"hidden":true,"waits":[[1.782,4.356],[4.818,13.167]],"skip":0.62,"links":[{"box":[76.875,5.0,18.958,7.407],"to":"back"}],"media":null},{"n":37,"hidden":true,"waits":[[2.079,4.818],[5.28,13.134]],"skip":0.62,"links":[{"box":[76.875,5.0,18.958,7.407],"to":"back"}],"media":null},{"n":38,"hidden":true,"waits":[[1.419,4.29],[4.752,12.672]],"skip":0.62,"links":[{"box":[76.875,5.0,18.958,7.407],"to":"back"}],"media":null},{"n":39,"hidden":true,"waits":[[2.046,4.62],[5.082,12.936]],"skip":0.62,"links":[{"box":[76.875,5.0,18.958,7.407],"to":"back"}],"media":null},{"n":40,"hidden":true,"waits":[[1.056,3.63],[4.818,11.979]],"skip":0.62,"links":[{"box":[76.875,5.0,18.958,7.407],"to":"back"}],"media":null},{"n":41,"hidden":true,"waits":[[1.452,4.092],[4.554,12.375]],"skip":0.62,"links":[{"box":[76.875,5.0,18.958,7.407],"to":"back"}],"media":null}]};
const S = {}; D.slides.forEach(s => S[s.n] = s);
const N = D.slides.length;
const MAIN = D.slides.filter(s => !s.hidden).map(s => s.n);
const va = document.getElementById('va'), vb = document.getElementById('vb');
const clip = document.getElementById('clip'), stage = document.getElementById('stage');
let act = va, cur = MAIN[0], step = 0, target = null, returnTo = null, typed = '', busy = 0;
const pad = n => String(n).padStart(2, '0');
const blobs = {};
const src = n => blobs[n] || ('seg/s' + pad(n) + '.mp4');
const other = () => act === va ? vb : va;

const hold = (n, k) => S[n].waits[k][0] + 0.35;               // 멈춰 보여 줄 곳 (슬라이드 영상 안의 시각)
const resume = (n, k) => Math.max(0, S[n].waits[k][1] - 0.12); // 다음 장면이 시작되는 곳

function loadInto(el, n) {               // 영상 요소에 슬라이드 n을 넣고 첫 그림이 준비될 때까지 기다린다
  return new Promise(res => {
    if (el.dataset.n == n && el.readyState >= 2) return res();
    el.dataset.n = n; el.src = src(n);
    const ok = () => { el.removeEventListener('error', ok); res(); };
    el.addEventListener('loadeddata', ok, { once: true }); el.addEventListener('error', ok, { once: true });
    el.load();
  });
}
function seek(el, t) {
  return new Promise(res => {
    if (Math.abs(el.currentTime - t) < 0.01) return res();
    el.addEventListener('seeked', () => res(), { once: true }); el.currentTime = t;
  });
}
async function show(n, t, play) {        // 슬라이드 n의 t초를 보여 준다 (다른 슬라이드면 뒤의 영상으로 바꿔 끼운다)
  const my = ++busy;
  const el = act.dataset.n == n ? act : other();
  await loadInto(el, n);
  if (my !== busy) return false;
  await seek(el, t);
  if (my !== busy) return false;
  if (play) el.play().catch(() => {}); else el.pause();
  if (el !== act) { el.classList.add('on'); act.classList.remove('on'); act.pause(); act = el; }
  return true;
}
function tick() {
  if (target === null) return;
  if (act.dataset.n == target.n && (act.currentTime >= target.t - 0.02 || act.ended)) {
    act.pause(); act.currentTime = target.t; target = null; render(); prepNext(); return;
  }
  requestAnimationFrame(tick);
}
async function playTo(n, from, k) {
  cur = n; step = k; target = { n, t: hold(n, k) }; render();
  if (await show(n, from, true)) requestAnimationFrame(tick);
}
async function jumpTo(n, k, play) {      // 바로 옮겨 가기 (살짝 사라졌다 나타남)
  target = null; stage.classList.add('dim');
  await new Promise(r => setTimeout(r, 150));
  if (play) { await playTo(n, S[n].skip, 0); }
  else { cur = n; step = k; render(); await show(n, hold(n, k), false); prepNext(); }
  stage.classList.remove('dim');
}
function nextMain(n) { const i = MAIN.indexOf(n); return i >= 0 && i < MAIN.length - 1 ? MAIN[i + 1] : null; }
function prepNext() {                     // 마지막 장면에 멈추면 다음 슬라이드를 뒤에 미리 넣어 둔다
  if (S[cur].hidden || step < S[cur].waits.length - 1) return;
  const m = nextMain(cur); if (m) loadInto(other(), m).then(() => { if (other().dataset.n == m) other().currentTime = 0; });
}
function next() {
  if (target) { if (act.dataset.n != target.n) return; act.pause(); act.currentTime = target.t; target = null; render(); prepNext(); return; }
  const w = S[cur].waits;
  if (step < w.length - 1) return playTo(cur, resume(cur, step), step + 1);
  if (S[cur].hidden) return back();
  const m = nextMain(cur);
  if (m) playTo(m, 0, 0);
}
function prev() {
  if (target) { target = null; act.pause(); }
  if (step > 0) return jumpTo(cur, step - 1);
  if (S[cur].hidden) return back();
  const i = MAIN.indexOf(cur);
  if (i > 0) { const p = MAIN[i - 1]; jumpTo(p, S[p].waits.length - 1); }
}
function back() { const r = returnTo || [23, 0]; returnTo = null; jumpTo(r[0], r[1]); }
function go(n) { if (!S[n]) return; returnTo = null; jumpTo(n, 0, true); }

function render() {
  stage.querySelectorAll('.hot').forEach(b => b.remove());
  const s = S[cur], idle = target === null;
  const i = MAIN.indexOf(cur);
  document.getElementById('count').textContent = s.hidden ? '단어' : (i + 1) + ' / ' + MAIN.length;
  document.getElementById('jump').value = s.hidden ? '' : String(cur);
  if (s.media && idle) {
    Object.assign(clip.style, { left: s.media[0] + '%', top: s.media[1] + '%', width: s.media[2] + '%', height: s.media[3] + '%', display: 'block' });
  } else { clip.pause(); clip.style.display = 'none'; }
  if (cur >= 20 && clip.preload === 'none') { clip.preload = 'auto'; clip.load(); }   // 대화 영상은 가까워지면 받는다
  if (!idle) return;
  s.links.forEach(L => {
    const b = document.createElement('button');
    b.className = 'hot'; b.setAttribute('aria-label', L.to === 'back' ? '수업으로 돌아가기' : '단어 그림 보기');
    Object.assign(b.style, { left: L.box[0] + '%', top: L.box[1] + '%', width: L.box[2] + '%', height: L.box[3] + '%' });
    b.onclick = e => { e.stopPropagation(); if (L.to === 'back') back(); else { returnTo = [cur, step]; jumpTo(L.to, 0, true); } };
    stage.appendChild(b);
  });
}

stage.addEventListener('click', e => { if (e.target === clip) return; next(); });
clip.addEventListener('click', e => e.stopPropagation());
document.getElementById('next').onclick = e => { e.stopPropagation(); next(); };
document.getElementById('prev').onclick = e => { e.stopPropagation(); prev(); };
document.getElementById('full').onclick = () => toggleFull();
const jump = document.getElementById('jump');
MAIN.forEach((n, i) => { const o = document.createElement('option'); o.value = n; o.textContent = (i + 1) + '번 슬라이드'; jump.appendChild(o); });
jump.onchange = () => { go(+jump.value); jump.blur(); };
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }

document.addEventListener('keydown', e => {
  if (e.target === jump) return;
  if (document.activeElement === clip && [' ', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const k = e.key;
  if (/^[0-9]$/.test(k)) { typed += k; return; }
  if (k === 'Enter' && typed) { const i = +typed - 1; typed = ''; if (MAIN[i]) go(MAIN[i]); e.preventDefault(); return; }
  typed = '';
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter', 'n', 'N'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p', 'P'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'Home') go(MAIN[0]);
  else if (k === 'End') go(MAIN[MAIN.length - 1]);
  showBar();
});

const bar = document.getElementById('bar'); let hideT;
function showBar() { bar.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => { if (!bar.matches(':hover') && !bar.contains(document.activeElement)) bar.classList.add('hide'); }, 2500); }
document.addEventListener('mousemove', showBar); document.addEventListener('touchstart', showBar, { passive: true });

// 뒤에서 받기: 순서대로(지금 슬라이드 근처 먼저) 받아 메모리에 넣는다. 파일로 열면(file://) 받을 필요 없음
const load = document.getElementById('load'), startBtn = document.getElementById('start');
let got = 0;
function progress() {
  const p = got / N;
  document.getElementById('fill').style.width = (p * 100) + '%';
  document.getElementById('loadsub').textContent = '받은 슬라이드 ' + got + ' / ' + N;
  document.getElementById('dl').textContent = got < N ? '받는 중 ' + got + '/' + N : '모두 받음';
  if (got === N) document.getElementById('loadmsg').textContent = '모두 준비됐어요!';
}
async function fetchSeg(n) {
  for (let t = 0; t < 4; t++) {
    try { const r = await fetch('seg/s' + pad(n) + '.mp4'); if (!r.ok) throw 0; blobs[n] = URL.createObjectURL(await r.blob()); return; }
    catch (e) { await new Promise(r => setTimeout(r, 1000 * (t + 1))); }
  }
}
async function background() {
  if (location.protocol === 'file:') { got = N; progress(); return true; }
  const order = [];
  let pos = 0;
  const pick = () => {                    // 지금 보는 슬라이드부터 앞으로 가며 아직 안 받은 것
    const start = Math.max(1, cur);
    for (let k = 0; k < N; k++) { const n = ((start - 1 + k) % N) + 1; if (!blobs[n] && !order.includes(n)) return n; }
    return null;
  };
  async function worker() {
    for (;;) { const n = pick(); if (n === null) return; order.push(n); await fetchSeg(n); got++; progress(); if (n === 1) ready(); }
  }
  await Promise.all([worker(), worker(), worker()]);
}
let started = false;
function ready() { startBtn.disabled = false; document.getElementById('loadmsg').textContent = '시작할 수 있어요!'; startBtn.focus(); }
startBtn.onclick = async () => { if (started) return; started = true; load.remove(); await playTo(MAIN[0], 0, 0); showBar(); };
